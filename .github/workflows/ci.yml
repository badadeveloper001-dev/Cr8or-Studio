name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cr8or_test
          POSTGRES_PASSWORD: cr8or_test_local_only
          POSTGRES_DB: cr8or_auth_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cr8or_test -d cr8or_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cr8or_test:cr8or_test_local_only@127.0.0.1:55432/cr8or_auth_test
      DIRECT_URL: postgresql://cr8or_test:cr8or_test_local_only@127.0.0.1:55432/cr8or_auth_test
      CR8OR_AUTH_TEST_DATABASE_URL: postgresql://cr8or_test:cr8or_test_local_only@127.0.0.1:55432/cr8or_auth_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Authentication database integration tests
        run: npm run test:auth-db

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
